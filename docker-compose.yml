services:
  voice-clip:
    build:
      context: .
      dockerfile: Dockerfile
    image: voice-clip:latest
    container_name: voice-clip
    restart: unless-stopped
    # Loopback-only port: on the NAS, Tailscale Funnel routes from the public
    # *.ts.net hostname to 127.0.0.1:8080. Binding to 127.0.0.1 (instead of
    # 0.0.0.0) prevents the LAN from hitting the container directly.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      PUBLIC_URL: ${PUBLIC_URL:-}
      USE_TLS: "false"
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      # Persistent state lives next to the compose file: per-user history,
      # cost.json, recordings, sessions, invites, pending-clips. Survives
      # container rebuilds.
      - ./data:/data
