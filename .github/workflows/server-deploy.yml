name: server-deploy

# Release = tag, not merge. A merge to master runs ONLY the `test` job (fast
# feedback so a broken master is caught at PR/merge time, not at release time).
# A prod deploy happens ONLY on `git tag vN && git push --tags` — the tag name
# (github.ref_name, e.g. `v32`) becomes the build version baked into the image
# and surfaced at GET /version. Server tags are `v*`; desktop releases use the
# separate `desktop-v*` namespace (tauri-release.yml) and don't match `v*`.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # One shared group keeps deploys serialized — two tags pushed back-to-back
  # must not roll the VPS concurrently. (cancel-in-progress: false → queue,
  # don't kill an in-flight deploy.)
  group: server-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  build-and-push:
    name: Build + push image
    needs: test
    # Only on a version tag — a plain master merge stops here (test-only).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 emulation — the VPS is a Hetzner CAX11 (Ampere ARM); we publish
      # a multi-arch manifest so `docker pull` resolves the right arch and
      # an accidental amd64-only image can't break the box at runtime.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The `deploy` job below rolls this image onto the VPS synchronously.
      # APP_VERSION build-arg = the tag (github.ref_name) → ENV in the image →
      # served at GET /version. Also tag the image with the version so a
      # specific release can be pulled/rolled back to by name, not just :sha.
      - name: Build + push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/rudnik275/voice-clip:latest
            ghcr.io/rudnik275/voice-clip:${{ github.ref_name }}
            ghcr.io/rudnik275/voice-clip:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tag-triggered deploy. The pushed `v*` tag IS the release: this job SSHes to
  # the VPS, rolls the freshly-pushed :latest image, health-gates it, and rolls
  # back on failure. If anything goes wrong the workflow run goes red
  # immediately — no silent gap, no VPS-side daemon to babysit. (Replaced the
  # old Watchtower pull model, which silently never ran.) Mirrors the deploy
  # job in the valorant-community-bot repo.
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    # Inherited gate: build-and-push is tag-only, and deploy needs it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Ship compose + litestream YAMLs first. Before this step, the deploy
      # job rolled the image but never copied compose/litestream changes —
      # only redeploy.sh / bootstrap-deploy.sh scp'd them, so a compose-only
      # merge on master was silently a no-op on the VPS.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_PRIVATE_KEY: "op://VoiceClip/voice-clip-deploy-1p/private key?ssh-format=openssh"

      - name: Sync compose + litestream.yml to VPS
        uses: appleboy/scp-action@v1
        with:
          host: 46.62.229.131
          username: deploy
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,litestream.yml"
          target: /opt/voice-clip/
          overwrite: true

      - name: Pull + restart voice-clip
        uses: appleboy/ssh-action@v1
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: 46.62.229.131
          username: deploy
          key: ${{ env.SSH_PRIVATE_KEY }}
          envs: GH_ACTOR,GH_TOKEN
          script: |
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            PREV_IMAGE=$(docker inspect --format '{{.Image}}' voice-clip 2>/dev/null || echo "none")
            echo "$PREV_IMAGE" > /opt/voice-clip/.last-image-id
            cd /opt/voice-clip && docker compose -f docker-compose.prod.yml pull voice-clip \
              && docker compose -f docker-compose.prod.yml up -d --no-deps voice-clip

      - name: Health-gate (60s poll)
        uses: appleboy/ssh-action@v1
        with:
          host: 46.62.229.131
          username: deploy
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 12); do
              status=$(docker inspect --format '{{.State.Health.Status}}' voice-clip 2>/dev/null || echo "none")
              if [ "$status" = "healthy" ]; then echo "✓ healthy"; exit 0; fi
              sleep 5
            done
            echo "✗ health timeout after 60s"; exit 1

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: 46.62.229.131
          username: deploy
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            PREV=$(cat /opt/voice-clip/.last-image-id 2>/dev/null || echo "none")
            if [ "$PREV" != "none" ] && [ -n "$PREV" ]; then
              docker tag "$PREV" ghcr.io/rudnik275/voice-clip:latest
              cd /opt/voice-clip && docker compose -f docker-compose.prod.yml up -d --no-deps voice-clip
            else
              echo "no previous image to rollback to"
            fi
