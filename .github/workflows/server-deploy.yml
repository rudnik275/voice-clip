name: server-deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  build-and-push:
    name: Build + push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Rollout is not done from CI. The VPS pulls this image:
      #   - first deploy:  ./scripts/bootstrap-deploy.sh (synchronous)
      #   - subsequent:    Watchtower auto-rolls (label-opt-in, 6h poll)
      # so no SSH private key ever has to live in GitHub secrets.
      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/rudnik275/voice-clip:latest
            ghcr.io/rudnik275/voice-clip:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
