name: tauri-release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

concurrency:
  group: tauri-release
  cancel-in-progress: false

jobs:
  release:
    name: Build + sign + release macOS DMG
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (stable, universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build, sign, and release with tauri-action
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: 'Voice Clip ${{ github.ref_name }}'
          includeUpdaterJson: true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tauri-action names the DMG with the version (Voice Clip_X.Y.Z_universal.dmg),
      # so the server's stable /download/latest → releases/latest/download/
      # voice-clip.dmg can't resolve it. Attach a stable-named copy.
      - name: Attach stable-named voice-clip.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg=$(ls desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          echo "Found DMG: $dmg"
          cp "$dmg" voice-clip.dmg
          gh release upload "${{ github.ref_name }}" voice-clip.dmg --clobber --repo "${{ github.repository }}"
