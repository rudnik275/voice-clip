<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#07070b" />
    <title>VoiceClip — offline</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: #07070b;
        color: #f1f1f7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 20px;
        text-align: center;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(ellipse 60% 50% at 30% 20%, rgba(115, 131, 255, 0.15), transparent 60%),
          radial-gradient(ellipse 60% 50% at 80% 90%, rgba(255, 100, 100, 0.12), transparent 60%);
      }
      main { max-width: 360px; }
      .badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        background: rgba(255, 100, 100, 0.18);
        color: #ff8a93;
        border: 1px solid rgba(255, 100, 100, 0.3);
        padding: 5px 12px;
        border-radius: 999px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 12px;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #8b8b9c;
        margin: 0 0 24px;
      }
      button {
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        padding: 14px 26px;
        color: white;
        background: linear-gradient(135deg, #7383ff, #b15eff);
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(115, 131, 255, 0.35);
        letter-spacing: 0.01em;
        -webkit-tap-highlight-color: transparent;
      }
      button:active { transform: scale(0.98); }
      .version { display: block; margin-top: 18px; font-size: 10px; color: rgba(255, 255, 255, 0.25); font-family: monospace; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">OFFLINE</span>
      <h1>Mac не отвечает</h1>
      <p>Сейчас не получается дотянуться до сервера. Проверь wifi и попробуй снова — приложение откроется в обычном режиме как только сеть появится.</p>
      <button onclick="location.replace('/')">Попробовать снова</button>
      <span class="version">v13</span>
    </main>
  </body>
</html>
