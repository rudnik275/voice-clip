<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="voice-clip" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/voice-clip-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>voice-clip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- No service worker registration: the SW is disabled during the
         Vue rewrite (it returns in a later task). The PWA manifest above
         keeps install-to-home-screen working. -->
  </head>
  <!-- ontouchstart="" enables the CSS :active mechanical-press on iOS Safari for
       every element on the page. Without a touch listener somewhere in the
       ancestor chain, iOS only fires :active on elements that have their own
       touch/pointer handler — which is why the record button (#rec, @pointerdown)
       pressed but the toolbar/history/modal buttons never did. The empty handler
       on <body> is the canonical fix and also covers the #tauri-pair splash that
       lives outside #app. -->
  <body ontouchstart="">
    <!-- Tauri-only "pair this Mac" splash. Hidden by default; web/tauri-runtime.ts
         un-hides it (via getElementById) when the desktop app boots without a
         Keychain device_token. It lives OUTSIDE #app (a fixed full-screen
         overlay, styled by .tauri-pair* in style.css) so it works without Vue
         reactivity and the PWA — where window.__TAURI__ is undefined — never
         shows it. Markup mirrors the pre-Vue home.html so style.css renders it
         identically. -->
    <section id="tauri-pair" class="tauri-pair" hidden>
      <div class="logo-sticker">voice-clip</div>
      <h1 class="tauri-pair-title">Hook this Mac up</h1>
      <p class="tauri-pair-explainer">
        Sign in with Google to pair this Mac. After that, you can record
        right here — and clips also land in this Mac's clipboard from your
        phone.
      </p>
      <button id="tauri-pair-btn" class="tauri-pair-btn" type="button">
        Sign in with Google
      </button>
      <p class="tauri-pair-hint" id="tauri-pair-hint" hidden>
        Browser opening — finish sign-in there. This window will refresh
        automatically when pairing completes.
      </p>
    </section>

    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
