<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VoiceClip" />
    <meta name="theme-color" content="#07070b" />
    <title>VoiceClip</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* Inline boot styles — render even if external stylesheet fails to load.
         Covers the "PWA opened offline + cache miss on bundled CSS" case. */
      html, body { margin: 0; padding: 0; height: 100%; background: #07070b; color: #f1f1f7; }
      body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      #boot-fallback {
        position: fixed; inset: 0; z-index: 9999;
        background: #07070b; color: #f1f1f7;
        display: none; place-items: center; text-align: center;
        padding: 20px;
      }
      #boot-fallback.shown { display: grid; }
      #boot-fallback .badge {
        display: inline-block;
        font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
        background: rgba(255, 100, 100, 0.18); color: #ff8a93;
        border: 1px solid rgba(255, 100, 100, 0.30);
        padding: 5px 12px; border-radius: 999px; margin-bottom: 20px;
      }
      #boot-fallback h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.01em; }
      #boot-fallback p { font-size: 14px; line-height: 1.5; color: #8b8b9c; max-width: 320px; margin: 0 0 24px; }
      #boot-fallback button {
        font-size: 15px; font-weight: 600; font-family: inherit;
        padding: 14px 26px; color: white;
        background: linear-gradient(135deg, #7383ff, #b15eff);
        border: none; border-radius: 14px; cursor: pointer;
        box-shadow: 0 8px 24px rgba(115, 131, 255, 0.35);
      }
      #boot-fallback .version { display: block; margin-top: 18px; font-size: 10px; color: rgba(255, 255, 255, 0.25); font-family: monospace; }
      #version-tag {
        position: fixed; right: 8px; z-index: 5;
        bottom: max(env(safe-area-inset-bottom), 6px);
        font-size: 9px; font-family: monospace;
        color: rgba(255, 255, 255, 0.28);
        user-select: none; pointer-events: none;
      }
    </style>
    <link rel="stylesheet" href="./style.css" />
    <script>
      // Boot fallback: if the bundled JS/CSS can't load (offline + cache miss
      // on the hashed Bun bundle URLs), reveal the inline OFFLINE panel.
      // No redirect involved — that could fail too if /offline isn't cached.
      // Two triggers:
      //   1. Any <script> or <link rel=stylesheet> failing to load → reveal now.
      //   2. After 4s with __voiceClipReady still false → reveal.
      (function () {
        var revealed = false
        function showFallback() {
          if (revealed) return
          revealed = true
          var el = document.getElementById('boot-fallback')
          if (el) {
            el.classList.add('shown')
            el.setAttribute('aria-hidden', 'false')
          }
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target
            if (!t || !t.tagName) return
            var rel = t.getAttribute && t.getAttribute('rel')
            if (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && rel === 'stylesheet')) {
              showFallback()
            }
          },
          true,
        )
        setTimeout(function () {
          if (!window.__voiceClipReady) showFallback()
        }, 4000)
      })()
    </script>
  </head>
  <body>
    <div id="boot-fallback" aria-hidden="true">
      <div>
        <span class="badge">OFFLINE</span>
        <h1>Mac не отвечает</h1>
        <p>Не получается загрузить приложение. Подключись к домашнему wifi и попробуй снова.</p>
        <button type="button" onclick="location.reload()">Попробовать снова</button>
        <span class="version">v10</span>
      </div>
    </div>

    <div id="version-tag">v10</div>

    <header class="topbar">
      <button id="history-btn" type="button" class="topbar-btn" aria-label="History">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <polyline points="3 4 3 9 8 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span id="history-badge" class="topbar-badge" hidden>0</span>
      </button>
      <div class="topbar-right">
        <span id="offline-pill" class="offline-pill" hidden>OFFLINE</span>
        <span id="total-pill" class="total-pill" title="Total spent">—</span>
        <button id="user-pill" class="user-pill" type="button" hidden aria-label="Account menu">
          <span id="user-name">…</span>
        </button>
      </div>
    </header>

    <div id="user-menu" class="user-menu" hidden role="dialog" aria-hidden="true" aria-label="Account">
      <div class="user-menu-backdrop"></div>
      <div class="user-menu-sheet">
        <p id="user-menu-name" class="user-menu-name"></p>
        <button id="install-daemon-btn" type="button" class="ghost-btn">📎 Подключить Mac</button>
        <button id="logout-btn" type="button" class="ghost-btn danger">Выйти</button>
        <button id="user-menu-close" type="button" class="ghost-btn">Закрыть</button>
      </div>
    </div>

    <main>
      <button id="rec" type="button" aria-label="Record">
        <div class="rec-inner">
          <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
            <path d="M19 11a7 7 0 0 1-14 0" />
            <path d="M12 18v3" />
          </svg>
          <span id="rec-label">Record</span>
        </div>
        <span id="rec-time" aria-hidden="true">00:00</span>
        <div class="busy-spinner" aria-hidden="true"></div>
      </button>
      <section id="result" hidden>
        <textarea id="text" readonly></textarea>
        <div class="result-footer">
          <span id="cost-line" class="cost-line"></span>
          <button id="copy" type="button">Copy</button>
        </div>
      </section>
      <p id="status" role="status"></p>
    </main>

    <div id="history-modal" class="history-modal" hidden aria-hidden="true">
      <div class="history-backdrop"></div>
      <section class="history-sheet" role="dialog" aria-modal="true" aria-label="History">
        <header class="history-head">
          <button id="history-close" class="topbar-btn" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6l-12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
          <h2>История</h2>
          <button id="mark-all-read" class="ghost-btn" type="button">Прочитать всё</button>
        </header>
        <div id="history-list" class="history-list"></div>
        <p id="history-empty" class="history-empty" hidden>Пусто. Запиши первое сообщение.</p>
      </section>
    </div>

    <script type="module" src="./app.ts"></script>
  </body>
</html>
