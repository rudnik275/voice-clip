<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icons/voice-clip-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Access denied — voice-clip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Self-contained Neo-Brutalism — see login.html for the why. */
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      :root {
        --bg: #FFFDF5;
        --fg: #09090B;
        --muted: #5A5A6E;
        --white: #FFFFFF;
        --red: #FF6B6B;
        --yellow: #FFD93D;
        --press: 100ms linear;
      }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.005em;
        overscroll-behavior: none;
      }
      body::before {
        content: ""; position: fixed; inset: 0;
        background-image: radial-gradient(circle at 1px 1px, rgba(9,9,11,0.12) 1.4px, transparent 0);
        background-size: 24px 24px;
        pointer-events: none; z-index: 0; opacity: 0.55;
        mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, black 30%, transparent 95%);
        -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, black 30%, transparent 95%);
      }
      .denied-wrap {
        position: relative; z-index: 1;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        min-height: 100dvh; gap: 28px;
        padding: 24px; text-align: center;
      }
      .denied-card {
        position: relative;
        width: min(460px, 92vw);
        padding: 40px 28px 32px;
        background: var(--white);
        border: 4px solid var(--fg);
        box-shadow: 10px 10px 0 var(--fg);
        transform: rotate(1deg);
        display: flex; flex-direction: column;
        align-items: center; gap: 18px;
      }
      .denied-sticker {
        display: inline-block;
        padding: 10px 18px 12px;
        background: var(--red);
        color: var(--white);
        border: 3px solid var(--fg);
        box-shadow: 4px 4px 0 var(--fg);
        transform: rotate(-2deg);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1;
        margin-bottom: 4px;
      }
      .denied-body {
        margin: 0;
        color: var(--fg);
        font-size: 15px;
        font-weight: 500;
        max-width: 36ch;
        line-height: 1.5;
      }
      .email-tape {
        display: inline-block;
        padding: 6px 14px 7px;
        background: var(--yellow);
        border: 2px solid var(--fg);
        box-shadow: 3px 3px 0 var(--fg);
        font-size: 14px;
        font-weight: 600;
        color: var(--fg);
        margin: 2px 0;
        word-break: break-all;
        max-width: 100%;
        transform: rotate(-1.5deg);
      }
      .denied-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 12px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        padding: 10px 18px;
        background: var(--white);
        color: var(--fg);
        border: 3px solid var(--fg);
        box-shadow: 5px 5px 0 var(--fg);
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.005em;
        cursor: pointer;
        text-decoration: none;
        transition: transform var(--press), box-shadow var(--press);
      }
      .btn:active {
        transform: translate(5px, 5px);
        box-shadow: 0 0 0 var(--fg);
      }
      .footer-version {
        position: fixed;
        bottom: max(env(safe-area-inset-bottom), 12px);
        right: 14px;
        padding: 4px 10px;
        background: var(--white);
        border: 2px solid var(--fg);
        box-shadow: 3px 3px 0 var(--fg);
        font-size: 11px;
        font-weight: 600;
        color: var(--fg);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
        z-index: 2;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="denied-wrap">
      <div class="denied-card">
        <span class="denied-sticker">Access denied</span>
        <p class="denied-body">
          The email on this Google account isn't on the voice-clip allowlist.
        </p>
        <span class="email-tape">__EMAIL__</span>
        <p class="denied-body">
          Ask the admin to add it, then sign in again.
        </p>
        <div class="denied-actions">
          <a class="btn" href="/">Back to sign in</a>
        </div>
      </div>
    </div>
    <div class="footer-version">__APP_VERSION__</div>
  </body>
</html>
