<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070b" />
    <title>Access denied — voice-clip</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .denied-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        gap: 32px;
        padding: 24px;
        text-align: center;
      }
      .denied-card {
        width: min(460px, 92vw);
        padding: 36px 28px 28px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border-strong);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border-radius: 28px;
        box-shadow: var(--shadow-deep);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .denied-title {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, var(--rec-a), var(--rec-b));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .denied-body {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        max-width: 36ch;
        line-height: 1.5;
      }
      .email-pill {
        display: inline-block;
        padding: 6px 12px;
        background: var(--glass-bg-hover);
        border: 1px solid var(--glass-border);
        border-radius: 999px;
        font-size: 13px;
        color: var(--fg);
        margin-top: 4px;
      }
      .denied-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 6px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        padding: 10px 18px;
        border: 1px solid var(--glass-border-strong);
        border-radius: 999px;
        background: var(--glass-bg-hover);
        color: var(--fg);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.18s ease;
        font-family: inherit;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.10);
      }
      .footer-version {
        position: fixed;
        bottom: max(env(safe-area-inset-bottom), 12px);
        right: 14px;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="denied-wrap">
      <div class="denied-card">
        <h1 class="denied-title">Access denied</h1>
        <p class="denied-body">
          The email on this Google account isn't on the voice-clip allowlist.
        </p>
        <span class="email-pill">__EMAIL__</span>
        <p class="denied-body">
          Ask the admin to add it, then sign in again.
        </p>
        <div class="denied-actions">
          <a class="btn" href="/">Back to sign in</a>
        </div>
      </div>
    </div>
    <div class="footer-version">__APP_VERSION__</div>
  </body>
</html>
