<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#07070b" />
    <title>VoiceClip — войти</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: #07070b;
        color: #f1f1f7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 20px;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(ellipse 60% 50% at 30% 20%, rgba(115, 131, 255, 0.15), transparent 60%),
          radial-gradient(ellipse 60% 50% at 80% 90%, rgba(177, 94, 255, 0.12), transparent 60%);
      }
      main { max-width: 380px; width: 100%; text-align: center; }
      .badge {
        display: inline-block;
        font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
        background: rgba(115, 131, 255, 0.18); color: #a8b2ff;
        border: 1px solid rgba(115, 131, 255, 0.3);
        padding: 5px 12px; border-radius: 999px; margin-bottom: 20px;
      }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
      .username { font-size: 18px; color: var(--accent-a, #a8b2ff); font-weight: 600; }
      p { font-size: 14px; line-height: 1.5; color: #8b8b9c; margin: 0 0 24px; }
      button {
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        padding: 14px 26px;
        color: white;
        background: linear-gradient(135deg, #7383ff, #b15eff);
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(115, 131, 255, 0.35);
        letter-spacing: 0.01em;
        -webkit-tap-highlight-color: transparent;
      }
      button:active { transform: scale(0.98); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .error { color: #ff8a93; font-size: 13px; min-height: 18px; margin-top: 14px; }
      .version { display: block; margin-top: 24px; font-size: 10px; color: rgba(255, 255, 255, 0.25); font-family: monospace; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">LOGIN</span>
      <h1>Привет, <span class="username" id="user-name">…</span></h1>
      <p>Это вход в твой существующий аккаунт на этом устройстве.</p>
      <button type="button" id="continue">Войти</button>
      <div class="error" id="error"></div>
      <span class="version">v10</span>
    </main>
    <script>
      (function () {
        var btn = document.getElementById('continue')
        var err = document.getElementById('error')
        var nameEl = document.getElementById('user-name')

        // Hydrate the username from the validity check the server already did
        // when it served this page. The token is the last path segment.
        // Token validity was verified server-side before the page was sent;
        // we only need the user's name from /login/:token/peek for display.
        fetch(location.pathname + '/peek')
          .then(function (r) { return r.ok ? r.json() : null })
          .then(function (data) {
            if (data && data.userName) nameEl.textContent = data.userName
            else nameEl.textContent = '…'
          })
          .catch(function () {})

        btn.addEventListener('click', function () {
          err.textContent = ''
          btn.disabled = true
          // POST consumes the token. Preview bots (iMessage / Slack / Telegram)
          // only do GET when rendering link previews — so they can't burn it.
          fetch(location.pathname, { method: 'POST' })
            .then(function (r) {
              if (r.ok || r.status === 303) {
                // Server set the session cookie; navigate to /.
                location.replace('/')
                return null
              }
              return r.text().catch(function () { return 'Login failed' })
            })
            .then(function (msg) {
              if (msg) err.textContent = typeof msg === 'string' ? msg : 'Login failed'
              btn.disabled = false
            })
            .catch(function () {
              err.textContent = 'Не получилось связаться с сервером'
              btn.disabled = false
            })
        })
      })()
    </script>
  </body>
</html>
