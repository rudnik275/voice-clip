<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="voice-clip" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/voice-clip-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>voice-clip — sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Self-contained Neo-Brutalism — does not load /style.css so the boot
         path renders even if the main bundle hasn't been cached yet. */
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      :root {
        --bg: #FFFDF5;
        --fg: #09090B;
        --muted: #5A5A6E;
        --white: #FFFFFF;
        --red: #FF6B6B;
        --yellow: #FFD93D;
        --press: 100ms linear;
      }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.005em;
        overscroll-behavior: none;
      }
      body::before {
        content: ""; position: fixed; inset: 0;
        background-image: radial-gradient(circle at 1px 1px, rgba(9,9,11,0.12) 1.4px, transparent 0);
        background-size: 24px 24px;
        pointer-events: none; z-index: 0; opacity: 0.55;
        mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, black 30%, transparent 95%);
        -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, black 30%, transparent 95%);
      }
      .login-wrap {
        position: relative; z-index: 1;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        min-height: 100dvh; gap: 28px;
        padding: 24px; text-align: center;
      }
      .login-card {
        position: relative;
        width: min(420px, 92vw);
        padding: 40px 28px 36px;
        background: var(--white);
        border: 4px solid var(--fg);
        box-shadow: 10px 10px 0 var(--fg);
        transform: rotate(-1deg);
        display: flex; flex-direction: column;
        align-items: center; gap: 22px;
      }
      .title-sticker {
        position: relative;
        padding: 8px 18px 10px;
        background: var(--yellow);
        border: 3px solid var(--fg);
        box-shadow: 4px 4px 0 var(--fg);
        transform: rotate(-2deg);
        margin-bottom: 4px;
      }
      .login-title {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--fg);
        line-height: 1;
      }
      .login-sub {
        margin: 0;
        color: var(--fg);
        font-size: 15px;
        font-weight: 500;
        max-width: 30ch;
        line-height: 1.4;
      }
      .google-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 22px;
        background: var(--white);
        color: var(--fg);
        border: 3px solid var(--fg);
        box-shadow: 6px 6px 0 var(--fg);
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-decoration: none;
        cursor: pointer;
        transition: transform var(--press), box-shadow var(--press);
      }
      .google-btn:active {
        transform: translate(6px, 6px);
        box-shadow: 0 0 0 var(--fg);
      }
      .google-btn svg {
        width: 22px; height: 22px; flex: none;
      }
      .footer-version {
        position: fixed;
        bottom: max(env(safe-area-inset-bottom), 12px);
        right: 14px;
        padding: 4px 10px;
        background: var(--white);
        border: 2px solid var(--fg);
        box-shadow: 3px 3px 0 var(--fg);
        font-size: 11px;
        font-weight: 600;
        color: var(--fg);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
        z-index: 2;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <!-- ontouchstart="" — enables CSS :active press on iOS Safari (see web/index.html). -->
  <body ontouchstart="">
    <div class="login-wrap">
      <div class="login-card">
        <div class="title-sticker">
          <h1 class="login-title">voice-clip</h1>
        </div>
        <p class="login-sub">Sign in to record audio and grab transcripts on every device.</p>
        <a class="google-btn" href="/auth/google/start">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.3 29.3 35.5 24 35.5 17.6 35.5 12.5 30.4 12.5 24S17.6 12.5 24 12.5c2.9 0 5.6 1.1 7.7 2.9l5.7-5.7C33.9 6.3 29.2 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5c10.8 0 19.5-8.7 19.5-19.5 0-1.2-.1-2.3-.4-3.5z" />
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12.5 24 12.5c2.9 0 5.6 1.1 7.7 2.9l5.7-5.7C33.9 6.3 29.2 4.5 24 4.5 16.3 4.5 9.7 8.8 6.3 14.7z" />
            <path fill="#4CAF50" d="M24 43.5c5.1 0 9.7-1.7 13.3-4.7l-6.1-5c-2 1.4-4.5 2.2-7.2 2.2-5.2 0-9.6-3.1-11.3-7.5l-6.6 5.1C9.5 39 16.2 43.5 24 43.5z" />
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.8l6.1 5c4.3-3.9 7.3-9.7 7.3-15.3 0-1.2-.1-2.3-.4-3.5z" />
          </svg>
          Sign in with Google
        </a>
      </div>
    </div>
    <div class="footer-version">__APP_VERSION__</div>
  </body>
</html>
