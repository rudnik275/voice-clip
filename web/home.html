<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>voice-clip</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .footer-version {
        position: fixed;
        bottom: max(env(safe-area-inset-bottom), 12px);
        right: 14px;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <button class="topbar-btn" id="history-btn" type="button" aria-label="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
          <path d="M3 3v5h5" />
          <path d="M12 7v5l3 2" />
        </svg>
      </button>
      <div class="topbar-right">
        <span class="total-pill" id="cost-pill" title="Your spend · all-users total">$0.0000 · Σ $0.0000</span>
        <span class="user-pill" id="user-pill">__NAME__</span>
      </div>
    </div>

    <main>
      <button id="rec" type="button" aria-label="Hold to record">
        <span class="rec-inner">
          <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0" />
            <path d="M12 18v4" />
          </svg>
          <span id="rec-label">Hold to talk</span>
        </span>
        <span id="rec-time"></span>
        <span class="busy-spinner" aria-hidden="true"></span>
      </button>
      <a class="download-cta" id="download-cta" href="/download/latest" hidden>
        <span class="download-cta-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <path d="M8 21h8M12 17v4" />
          </svg>
        </span>
        <span class="download-cta-title">Download Voice Clip for macOS</span>
        <span class="download-cta-sub">Recording happens on your phone — the Mac app pastes clips here.</span>
      </a>
    </main>

    <p id="status" role="status" aria-live="polite"></p>

    <div class="history-modal" id="history-modal" hidden>
      <div class="history-backdrop" id="history-backdrop"></div>
      <div class="history-sheet">
        <div class="history-head">
          <button class="ghost-btn" id="history-close" type="button">Close</button>
          <h2>History</h2>
          <button class="ghost-btn danger" id="history-clear" type="button">Clear</button>
        </div>
        <div class="history-list" id="history-list"></div>
      </div>
    </div>

    <div class="profile-modal" id="profile-modal" hidden>
      <div class="profile-backdrop" id="profile-backdrop"></div>
      <div class="profile-sheet">
        <div class="profile-head">
          <button class="ghost-btn" id="profile-close" type="button">Close</button>
          <h2>Profile</h2>
          <button class="ghost-btn danger" id="profile-logout" type="button">Sign out</button>
        </div>
        <div class="profile-body">
          <h3 class="profile-section-title">Paired devices</h3>
          <div class="profile-devices" id="profile-devices"></div>
        </div>
      </div>
    </div>

    <div class="footer-version">__APP_VERSION__</div>

    <script type="module" src="/app.ts"></script>
  </body>
</html>
