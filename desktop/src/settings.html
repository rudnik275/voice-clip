<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Clip — Settings</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Settings is a list, not a centred card — override `main`. */
      main {
        min-height: 100vh;
        padding: 24px 22px 28px;
        align-items: flex-start;
        justify-content: flex-start;
      }
      .settings-section {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
        text-align: left;
      }
      .page-header {
        display: inline-block;
        padding: 8px 16px 10px;
        background: var(--violet);
        border: 3px solid var(--fg);
        box-shadow: 4px 4px 0 var(--fg);
        transform: rotate(-1.5deg);
        margin-bottom: 6px;
      }
      .page-header h1 {
        font-size: 20px;
        margin: 0;
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: var(--white);
        border: 3px solid var(--fg);
        box-shadow: 5px 5px 0 var(--fg);
        padding: 14px 16px;
      }
      .settings-row-label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      .settings-row-label strong {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .settings-row-label span {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        line-height: 1.4;
      }

      /* Brutalist toggle — red (off) / green (on), black square thumb that
         slams across when checked. */
      .toggle-wrap {
        position: relative;
        flex-shrink: 0;
      }
      .toggle-wrap input[type="checkbox"] {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
        pointer-events: none;
      }
      .toggle {
        display: block;
        width: 56px;
        height: 30px;
        background: var(--red);
        border: 3px solid var(--fg);
        box-shadow: 3px 3px 0 var(--fg);
        cursor: pointer;
        position: relative;
        transition: background 140ms ease;
      }
      .toggle::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        background: var(--fg);
        transition: transform 160ms var(--spring);
      }
      .toggle-wrap input:checked + .toggle {
        background: var(--green);
      }
      .toggle-wrap input:checked + .toggle::after {
        transform: translateX(26px);
      }
      .toggle-wrap input:focus-visible + .toggle {
        outline: 3px solid var(--violet);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="settings-section">
        <div class="page-header">
          <h1>Settings</h1>
        </div>

        <div class="settings-row">
          <div class="settings-row-label">
            <strong>Launch at Login</strong>
            <span>
              Start Voice Clip automatically when you log in to your Mac.
              Installs a LaunchAgent in ~/Library/LaunchAgents.
            </span>
          </div>
          <div class="toggle-wrap">
            <input type="checkbox" id="autostart-toggle" />
            <label class="toggle" for="autostart-toggle"></label>
          </div>
        </div>
      </div>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
