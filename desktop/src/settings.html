<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Clip — Settings</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      main {
        min-height: 100vh;
        padding: 32px 28px;
        align-items: flex-start;
      }
      .settings-section {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 20px;
        text-align: left;
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        backdrop-filter: blur(24px) saturate(180%);
        border-radius: 14px;
        padding: 14px 18px;
        gap: 16px;
      }
      .settings-row-label {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .settings-row-label strong {
        font-size: 14px;
        font-weight: 500;
      }
      .settings-row-label span {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.4;
      }
      /* iOS-style toggle */
      .toggle-wrap {
        position: relative;
        flex-shrink: 0;
      }
      .toggle-wrap input[type="checkbox"] {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle {
        display: block;
        width: 44px;
        height: 26px;
        border-radius: 13px;
        background: var(--glass-border);
        cursor: pointer;
        transition: background 0.2s ease;
        position: relative;
      }
      .toggle::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.2s cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      .toggle-wrap input:checked + .toggle {
        background: var(--accent-a);
      }
      .toggle-wrap input:checked + .toggle::after {
        transform: translateX(18px);
      }
      .page-header {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-bottom: 4px;
      }
      .page-header h1 {
        font-size: 20px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="settings-section">
        <div class="page-header">
          <h1>Settings</h1>
        </div>

        <div class="settings-row">
          <div class="settings-row-label">
            <strong>Launch at Login</strong>
            <span>
              Start Voice Clip automatically when you log in to your Mac.
              Installs a LaunchAgent in ~/Library/LaunchAgents.
            </span>
          </div>
          <div class="toggle-wrap">
            <input type="checkbox" id="autostart-toggle" />
            <label class="toggle" for="autostart-toggle"></label>
          </div>
        </div>
      </div>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
