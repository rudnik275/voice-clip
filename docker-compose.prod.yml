# Production compose file for the VPS deploy.
#
# Cloudflare Tunnel (running in the shared `infra-net` network) terminates
# TLS and routes voice.rudifamily.uk → voice-clip:8080. The host port
# binding is loopback-only as a defence-in-depth.

services:
  voice-clip:
    image: ghcr.io/rudnik275/voice-clip:latest
    container_name: voice-clip
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    volumes:
      # SQLite db + WAL + per-user state live here. Persists across image rolls.
      - ./data:/data
    labels:
      # Opt this container into the shared Watchtower (infra-net singleton,
      # WATCHTOWER_LABEL_ENABLE=true, 6h poll). CI pushes a fresh
      # ghcr.io/rudnik275/voice-clip:latest → Watchtower auto-rolls it.
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  voice-clip-litestream:
    image: litestream/litestream:latest
    container_name: voice-clip-litestream
    # NOT unless-stopped: a misconfigured backup (missing/invalid
    # LITESTREAM_S3_* env) must not crash-loop forever — endless container
    # churn on the shared infra-net destabilises Docker's embedded DNS
    # (127.0.0.11), which made cloudflared intermittently fail to resolve
    # `voice-clip` → tunnel 502s for the app. Bounded retries instead: it
    # gives up after 3 failures rather than taking the tunnel down with it.
    restart: on-failure:3
    command: replicate
    volumes:
      # Read-only view of the data dir — litestream tails the WAL file only.
      - ./data:/data:ro
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_S3_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_S3_SECRET_ACCESS_KEY}
    depends_on:
      - voice-clip
    networks:
      - infra-net

networks:
  infra-net:
    external: true
