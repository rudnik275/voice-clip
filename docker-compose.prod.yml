# Production compose file for the VPS deploy.
#
# voice-clip owns its OWN Cloudflare Tunnel ("voice-clip", id 3087388c…),
# served by the `voice-clip-cloudflared` connector below (shared `infra-net`).
# It terminates TLS and routes voice.rudifamily.uk → voice-clip:8080. The
# host port binding is loopback-only as a defence-in-depth.
#
# (Previously voice.rudifamily.uk squatted on the unrelated `valorant-bot`
# tunnel's connector; this service de-couples it onto its own tunnel.)

services:
  voice-clip:
    image: ghcr.io/rudnik275/voice-clip:latest
    container_name: voice-clip
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    volumes:
      # SQLite db + WAL + per-user state live here. Persists across image rolls.
      - ./data:/data
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  voice-clip-litestream:
    image: litestream/litestream:latest
    container_name: voice-clip-litestream
    # The litestream image defaults to a `nonroot` user, but the SQLite db
    # is owned by the app container's uid (100). litestream 0.5.x must write
    # the db (the `_litestream_seq` table), so run it as root to match the
    # file owner — same as the valorant-bot litestream sidecar.
    user: "0:0"
    # unless-stopped so the backup survives a host reboot. litestream does
    # NOT exit on S3 errors (it logs + retries with backoff, container stays
    # up), so this can't crash-loop on a transient outage. Fatal config
    # errors that DO exit are caught in CI / first-deploy verification.
    restart: unless-stopped
    command: replicate
    volumes:
      # RW — litestream 0.5.x writes a `_litestream_seq` bookkeeping table
      # into the SQLite db, so a read-only mount fails with
      # `attempt to write a readonly database`.
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_S3_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_S3_SECRET_ACCESS_KEY}
      # litestream.yml interpolates ${LITESTREAM_S3_BUCKET} / _ENDPOINT from
      # the container env — they MUST be passed in here too, not just the
      # credentials. Without them litestream expands them to "" and dies with
      # `bucket required for s3 replica`.
      LITESTREAM_S3_BUCKET: ${LITESTREAM_S3_BUCKET}
      LITESTREAM_S3_ENDPOINT: ${LITESTREAM_S3_ENDPOINT}
    depends_on:
      - voice-clip
    networks:
      - infra-net

  # Dedicated Cloudflare Tunnel connector for the `voice-clip` tunnel.
  # Token-managed (remote ingress config lives in the CF dashboard:
  # voice.rudifamily.uk → http://voice-clip:8080). On the same infra-net so
  # it can reach the app by container name. Token comes from .env
  # (VOICE_CLIP_TUNNEL_TOKEN) and is never baked into the image.
  #
  # NOTE: the CI deploy only rolls `voice-clip` (`up -d --no-deps voice-clip`),
  # so it never restarts this connector. Bring it up manually after a token
  # change: `docker compose -f docker-compose.prod.yml up -d voice-clip-cloudflared`.
  voice-clip-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: voice-clip-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${VOICE_CLIP_TUNNEL_TOKEN}
    depends_on:
      - voice-clip
    networks:
      - infra-net

networks:
  infra-net:
    external: true
